
# ─────────────────────────────────────────────────────────────────
# MS-365 MCP Server — docker-compose.yml
#
# Network strategy: Option B — shared named Docker network.
# Before running, create the shared network ONCE on your VM:
#
#   docker network create ai-net
#   docker network connect ai-net <your-ai-app-container-name>
#
# Then your AI app can call this server at:
#   http://ms365-mcp:4000/mcp
# ─────────────────────────────────────────────────────────────────

services:
  ms365-mcp:
    # Pull the official pre-built image (no build step needed)
    image: ghcr.io/softeria/ms-365-mcp-server:latest

    # OR build from this repo's source — uncomment and remove the image line above:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: ms365-mcp
    restart: unless-stopped

    ports:
      - "0.0.0.0:4000:4000"   # MCP HTTP endpoint exposed at YOUR_VM_IP:4000

    # Copy .env.example to .env on your VM and fill in your Azure credentials
    # .env is gitignored — never committed to the repo
    env_file:
      - .env

    environment:
      NODE_ENV: production
      # HTTPS URL exposed through the Nginx reverse proxy on port 8443
      MS365_MCP_PUBLIC_URL: "https://localhost:8443"
      # Allows the AI app to discover tools (initialize, tools/list) before a user token is supplied
      MS365_MCP_ALLOW_UNAUTHENTICATED_DISCOVERY: "true"
      # Mail, Calendar, OneDrive, and SharePoint scopes
      MS365_MCP_ALLOWED_SCOPES: "Mail.ReadWrite Mail.Send Calendars.ReadWrite Sites.Read.All Sites.ReadWrite.All Files.Read.All Files.ReadWrite.All User.Read offline_access"
      # Debug logging - enables all debug log lines
      LOG_LEVEL: "debug"
      # Set to false to prevent masking/redacting of emails, URLs and error response bodies
      MS365_MCP_REDACT_PII: "false"
      # Explicit log directory for persistent file logs
      MS365_MCP_LOG_DIR: "/logs"

    # --http binds on all interfaces so Docker inter-container networking works
    # Expose Outlook email, calendar, OneDrive files, and SharePoint/work tools
    command:
      - "--http"
      - "0.0.0.0:4000"
      - "--org-mode"
      - "--preset"
      - "mail,calendar,files,work"
      - "-v"                  # Enables console logging for docker logs
      # - "--read-only"       # uncomment to disable all write operations

    volumes:
      - mcp-tokens:/root/.config/ms-365-mcp-server
      - ./logs:/logs

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


  nginx:
    image: nginx:alpine
    container_name: ms365-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8443:8443"   # HTTPS endpoint exposed on port 8443 (co-exists with Caddy on 443)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ms365-mcp

volumes:
  mcp-tokens:


