
# ─────────────────────────────────────────────────────────────────
# MS-365 MCP Server — docker-compose.yml
#
# Network strategy: Option B — shared named Docker network.
# Before running, create the shared network ONCE on your VM:
#
#   docker network create ai-net
#   docker network connect ai-net <your-ai-app-container-name>
#
# Then your AI app can call this server at:
#   http://ms365-mcp:4000/mcp
# ─────────────────────────────────────────────────────────────────

services:
  ms365-mcp:
    # Pull the official pre-built image (no build step needed)
    image: ghcr.io/softeria/ms-365-mcp-server:latest

    # OR build from this repo's source — uncomment and remove the image line above:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: ms365-mcp
    restart: unless-stopped

    ports:
      - "4000:4000"           # MCP HTTP endpoint exposed at YOUR_VM_IP:4000

    # Copy .env.example to .env on your VM and fill in your Azure credentials
    # .env is gitignored — never committed to the repo
    env_file:
      - .env

    environment:
      NODE_ENV: production
      # Dummy HTTPS value — required by MCP SDK which enforces HTTPS on the issuer URL.
      # Your AI app still calls this server over plain HTTP inside Docker (http://ms365-mcp:4000/mcp).
      MS365_MCP_PUBLIC_URL: "https://localhost:4000"

    # --http binds on all interfaces so Docker inter-container networking works
    # --org-mode enables Teams/SharePoint — remove if personal Outlook/OneDrive only
    command:
      - "--http"
      - "0.0.0.0:4000"
      - "--org-mode"
      # - "--read-only"       # uncomment to disable all write operations
      # - "--preset"
      # - "mail"              # expose only email tools

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - ai-net                # shared network with your existing AI app container

# ─────────────────────────────────────────────────────────────────
# Shared Network — must exist before running docker compose up
# Create it once:  docker network create ai-net
# Connect AI app:  docker network connect ai-net <ai-app-container>
# ─────────────────────────────────────────────────────────────────
networks:
  ai-net:
    external: true
