events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8443 ssl;
        server_name _;

        # SSL Configuration
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Disable buffering so MCP streaming/SSE flushes immediately
        proxy_buffering off;
        proxy_cache off;

        location / {
            proxy_pass http://ms365-mcp:4000;
            proxy_http_version 1.1;

            # Forward standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Upgrade headers for long-lived / streaming connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            # Prevent timeouts during long AI inference/tool calls
            proxy_connect_timeout 60s;
            proxy_send_timeout    86400s;
            proxy_read_timeout    86400s;
        }
    }
}
